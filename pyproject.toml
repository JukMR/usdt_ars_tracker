[tool.poetry]
name = "crypto-tracking"
version = "0.2.0"
description = "Local multi-source crypto price tracker with a live dashboard and threshold alerts"
authors = ["Julian Merida <julianmr97@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
flask = "^3.0.3"
sqlalchemy = "^2.0.32"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
mypy = "^1.10.0"
ruff = "^0.9.0"
types-requests = "^2.32.0"

[tool.poetry.scripts]
crypto-track = "crypto_tracking.cli:main"
crypto-poller = "crypto_tracking.cli:poll_main"
crypto-backend = "crypto_tracking.cli:serve_main"
crypto-frontend = "crypto_tracking.cli:serve_main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
