[project]
name = "crypto-tracking"
version = "0.2.0"
description = "Local multi-source crypto price tracker with a live dashboard and threshold alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Julian Merida", email = "julianmr97@gmail.com" }]
dependencies = [
    "flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "sqlalchemy>=2.0.32,<3",
]

[project.scripts]
crypto-track = "crypto_tracking.cli:main"
crypto-poller = "crypto_tracking.cli:poll_main"
crypto-backend = "crypto_tracking.cli:serve_main"
crypto-frontend = "crypto_tracking.cli:serve_main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.3.2",
    "ruff>=0.9",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_tracking"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "DTZ",  # flake8-datetimez
    "G",    # flake8-logging-format
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]  # tests deliberately construct naive datetimes

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
